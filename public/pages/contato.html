<h2>Entre em Contato</h2>
<form action="#">
    <label>Nome Completo:</label>
    <input type="text" required>
    
    <label>E-mail:</label>
    <input type="email" required>
    
    <label>Mensagem:</label>
    <textarea rows="5" required></textarea>
    
    <button type="submit">Enviar Mensagem</button>
</form>
